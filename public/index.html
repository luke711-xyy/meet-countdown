<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15202a" />
    <title>见面倒计时</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=6" />
  </head>
  <body>
    <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title">
      <div class="auth-sheet glass-panel">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10M7 20h10M8 4c0 4 1.7 5.5 4 8-2.3 2.5-4 4-4 8M16 4c0 4-1.7 5.5-4 8 2.3 2.5 4 4 4 8"/></svg></span>
        <p class="section-kicker">MEET COUNTDOWN</p>
        <h1 id="auth-title">把这段等待，留给你们两个人</h1>
        <p class="auth-intro" id="auth-intro">登录后创建或加入一个只属于两个人的房间。</p>
        <div class="auth-tabs" role="tablist" aria-label="账号操作">
          <button class="auth-tab is-active" id="login-tab" type="button" role="tab" aria-selected="true">登录</button>
          <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false">注册</button>
        </div>
        <form id="auth-form">
          <label class="sr-only" for="auth-username">账号名称</label>
          <input id="auth-username" type="text" autocomplete="username" placeholder="账号名称" maxlength="24" required />
          <label class="sr-only" for="auth-password">密码</label>
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="密码（至少 8 位）" minlength="8" maxlength="72" required />
          <p class="auth-status" id="auth-status" role="status"></p>
          <button class="primary-button auth-submit" id="auth-submit" type="submit">登录</button>
        </form>
      </div>
    </section>

    <section class="room-gate hidden" id="room-gate" aria-labelledby="room-gate-title">
      <div class="room-gate-sheet glass-panel">
        <p class="section-kicker">ROOM</p>
        <h1 id="room-gate-title">还没有进入房间</h1>
        <p id="room-gate-message">创建一个新房间，或者打开对方发来的邀请链接。</p>
        <button class="primary-button" id="create-room-button" type="button">创建新房间</button>
      </div>
    </section>

    <div class="background-layer" aria-hidden="true"></div>
    <canvas class="water-canvas" id="water-canvas" aria-hidden="true"></canvas>
    <canvas class="doodle-canvas" id="doodle-canvas" aria-hidden="true"></canvas>
    <div class="background-wash" aria-hidden="true"></div>
    <canvas class="html-canvas-probe" id="html-canvas-probe" layoutsubtree aria-hidden="true"><div id="html-canvas-probe-content"> </div></canvas>

    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10M7 20h10M8 4c0 4 1.7 5.5 4 8-2.3 2.5-4 4-4 8M16 4c0 4-1.7 5.5-4 8 2.3 2.5 4 4 4 8"/></svg></span>
          <div>
            <p class="brand-name">见面倒计时</p>
          </div>
        </div>
        <div class="topbar-actions"><span class="account-name" id="account-name"></span><button class="icon-button" id="open-settings" type="button" aria-label="打开设置" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button></div>
      </header>

      <section class="hero" aria-labelledby="countdown-heading">
        <h1 id="countdown-heading">距离下一次见面</h1>
        <p class="target-summary" id="target-summary"></p>

        <div class="countdown-panel glass-panel">
          <div class="countdown-grid" id="countdown" aria-live="polite" aria-atomic="true">
            <div class="time-unit"><strong id="days">—</strong><span>天</span></div>
            <div class="time-separator" aria-hidden="true">:</div>
            <div class="time-unit"><strong id="hours">—</strong><span>小时</span></div>
            <div class="time-separator" aria-hidden="true">:</div>
            <div class="time-unit"><strong id="minutes">—</strong><span>分钟</span></div>
            <div class="time-separator" aria-hidden="true">:</div>
            <div class="time-unit"><strong id="seconds">—</strong><span>秒</span></div>
          </div>
        </div>

        <p class="current-time" id="current-time">现在是 —</p>
      </section>

      <footer class="footer-note">
        <span id="slogan">把想念留给时间</span>
        <span id="timezone-label">本地时间</span>
      </footer>
    </main>

    <aside class="edge-rail edge-rail-left" id="voice-rail" aria-label="留言">
      <div class="edge-capsules" id="voice-capsules" aria-live="polite"></div>
      <div class="voice-recording-capsule hidden" id="voice-recording-capsule">
        <span class="capsule-pulse" aria-hidden="true"></span><span id="record-time">0s</span><button class="capsule-cancel" id="cancel-voice" type="button">取消</button><button class="capsule-stop" id="stop-voice" type="button">结束</button>
      </div>
      <div class="edge-hover-bridge" aria-hidden="true"></div>
      <button class="edge-orb" id="voice-orb" type="button" aria-expanded="false" aria-label="点击录音">
        <svg class="edge-orb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3.5" width="8" height="11" rx="4"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3M8.5 21.5h7"/></svg><span class="edge-count" id="voice-count"></span>
      </button>
    </aside>

    <aside class="edge-rail edge-rail-right" id="task-rail" aria-label="清单">
      <div class="task-board" id="task-capsules" aria-live="polite">
        <section class="task-zone task-zone-theirs" aria-label="对方的任务"><div class="task-list" id="task-list-theirs"></div></section>
        <div class="task-divider" aria-hidden="true"></div>
        <section class="task-zone task-zone-mine" aria-label="我的任务"><div class="task-list" id="task-list-mine"></div></section>
      </div>
      <form class="task-composer-capsule hidden" id="task-form">
        <input id="task-input" type="text" maxlength="120" placeholder="写下一件小事" aria-label="新任务" /><button class="capsule-cancel" id="cancel-task" type="button">取消</button><button class="task-submit" type="submit" aria-label="添加任务">＋</button>
      </form>
      <div class="edge-hover-bridge" aria-hidden="true"></div>
      <button class="edge-orb" id="task-orb" type="button" aria-expanded="false" aria-label="点击添加任务">
        <svg class="edge-orb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 21V4"/><path d="M7 5c3-2 5 2 10 0v8c-5 2-7-2-10 0z"/></svg><span class="edge-count" id="task-count"></span>
      </button>
    </aside>

    <section class="settings-dialog hidden" id="settings-dialog" aria-labelledby="settings-title" aria-hidden="true">
      <form class="settings-sheet" id="settings-form">
        <div class="dialog-heading">
          <div>
            <p class="section-kicker">CUSTOMIZE</p>
            <h2 id="settings-title">把这段等待，放在你的照片里</h2>
          </div>
          <button class="close-button" id="close-settings" type="button" aria-label="关闭设置">×</button>
        </div>

        <div class="form-field">
          <label for="target-at">下次见面时间</label>
          <input id="target-at" name="targetAt" type="datetime-local" required />
          <p class="field-hint">时间会按这台设备的本地时区保存。</p>
        </div>

        <div class="form-field">
          <div class="label-row"><label>倒计时背景</label><span id="file-name">默认背景</span></div>
          <button class="upload-box" id="choose-background" type="button">
            <span class="upload-icon" aria-hidden="true">＋</span>
            <span>选择一张照片</span>
            <small>JPG、PNG、WEBP 或 GIF · 最大 8 MB</small>
          </button>
          <button class="text-button hidden" id="remove-background" type="button">恢复默认背景</button>
        </div>

        <div class="form-field">
          <div class="label-row"><label for="blur-range">背景模糊度</label><output id="blur-output" for="blur-range">0 px</output></div>
          <input id="blur-range" type="range" min="0" max="24" value="0" step="1" />
          <div class="range-labels"><span>清晰</span><span>柔和</span></div>
        </div>

        <div class="form-field">
          <div class="label-row"><label for="contrast-range">背景对比度</label><output id="contrast-output" for="contrast-range">100%</output></div>
          <input id="contrast-range" type="range" min="0" max="2" value="1" step="0.01" />
          <div class="range-labels"><span>0%</span><span>200%</span></div>
        </div>

        <div class="form-field">
          <div class="label-row"><label for="brightness-range">背景亮度</label><output id="brightness-output" for="brightness-range">100%</output></div>
          <input id="brightness-range" type="range" min="0" max="2" value="1" step="0.01" />
          <div class="range-labels"><span>0%</span><span>200%</span></div>
        </div>

        <div class="form-field">
          <div class="label-row"><label for="slogan-input">底部文案</label><output id="slogan-count">0/20</output></div>
          <input id="slogan-input" type="text" maxlength="20" placeholder="把想念留给时间" autocomplete="off" />
        </div>

        <div class="form-field brush-settings">
          <div class="label-row"><label for="brush-color">涂鸦颜色</label><output id="brush-color-output">#8BE9FD</output></div>
          <input id="brush-color" type="color" value="#8be9fd" />
          <div class="brush-style-options" role="group" aria-label="涂鸦样式">
            <button class="brush-style-option is-active" id="brush-style-neon" type="button" data-brush-style="neon">霓虹灯</button>
            <button class="brush-style-option" id="brush-style-fireworks" type="button" data-brush-style="fireworks">荧光棒烟花</button>
          </div>
        </div>

        <div class="room-settings">
          <div class="label-row"><label for="invite-url">房间邀请</label><span id="room-members">1 / 2</span></div>
          <div class="invite-row"><input id="invite-url" type="text" readonly aria-label="房间邀请链接" /><button class="text-button" id="copy-invite" type="button">复制</button></div>
          <button class="text-button danger-button" id="destroy-room" type="button">退出并销毁房间</button>
          <button class="text-button" id="logout-button" type="button">退出登录</button>
        </div>

        <div class="dialog-actions">
          <p class="save-status" id="save-status" role="status"></p>
          <button class="primary-button" id="save-settings" value="default" type="submit">保存设置</button>
        </div>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="context-menu hidden" id="context-menu" role="menu">
      <button id="context-delete" type="button" role="menuitem">删除</button>
    </div>
    <script type="module" src="/app.js?v=7"></script>
  </body>
</html>
